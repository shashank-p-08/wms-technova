# Weekly dependency update pull requests. CI runs on each one before merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /CloudWMS/server
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      nestjs: { patterns: ["@nestjs/*"] }
      aws-sdk: { patterns: ["@aws-sdk/*"] }

  - package-ecosystem: npm
    directory: /CloudWMS/client
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      react: { patterns: ["react", "react-dom", "@types/react*"] }
      lint: { patterns: ["eslint*", "@eslint/*", "typescript-eslint"] }

  - package-ecosystem: pip
    directory: /scripts/python
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directory: /CloudWMS/server
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directory: /CloudWMS/client
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
