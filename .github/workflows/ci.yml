name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  client:
    name: Web app - lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CloudWMS/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CloudWMS/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ---------------------------------------------------------------------------
  api:
    name: API - build, migrations, end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CloudWMS/server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: technova_wms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ci-password
      DB_NAME: technova_wms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CloudWMS/server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build

      - name: Apply migrations to an empty database
        run: npm run migration:run

      - name: Migrations match the entities (no schema drift)
        run: npx typeorm migration:generate src/database/migrations/Drift -d dist/database/data-source.js --check

      - name: Start API in production mode
        env:
          NODE_ENV: production
          PORT: 3000
          JWT_SECRET: ci-only-signing-key-0123456789abcdefghijklmnop
          CORS_ORIGINS: http://localhost:5173
          ADMIN_EMAIL: admin@technova.local
          ADMIN_PASSWORD: Ci-Admin-Passw0rd!
          LOGIN_RATE_LIMIT_PER_MINUTE: '1000'
        run: |
          node dist/main > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 1
          done
          cat api.log; exit 1

      - name: End-to-end tests (auth, roles, warehouse isolation, concurrency)
        env:
          API_URL: http://localhost:3000/api
          ADMIN_EMAIL: admin@technova.local
          ADMIN_PASSWORD: Ci-Admin-Passw0rd!
        run: python test/e2e/api_e2e.py

      - name: API log
        if: failure()
        run: cat api.log

  # ---------------------------------------------------------------------------
  infrastructure:
    name: Infrastructure - lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: cfn-lint infrastructure/cloudformation/*.yaml --regions us-east-1 us-west-2
      - uses: hashicorp/setup-terraform@v4
      - name: terraform fmt / validate
        working-directory: infrastructure/terraform
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate
      - name: Python scripts compile
        run: python -m py_compile scripts/python/*.py

  # ---------------------------------------------------------------------------
  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [client, api]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cloudwms-api:ci CloudWMS/server
      - run: docker build -t cloudwms-web:ci --build-arg VITE_API_URL=/api CloudWMS/client
